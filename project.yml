name: Companion
options:
  bundleIdPrefix: app.personal
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LocalLLM:
    path: Packages/LocalLLM
targets:
  Companion:
    type: application
    platform: iOS
    dependencies:
      - package: LocalLLM
        product: LocalLLM
      - target: MiraWidgets
        embed: true
    sources:
      - path: App
        excludes: [Info.plist]
      - Core
      - DownloadCore
      - Shared
      - ActivityCore
      - path: Resources/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.companion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 'Мира'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Микрофон нужен для разговора с Мирой.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Распознавание превращает вашу речь в текст. Обработка может выполняться серверами Apple.'
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 'Мира создаёт напоминания только после вашего подтверждения.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  MiraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist]
      - Shared
      - ActivityCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.companion.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 'Мира'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, LifecycleTests]
    dependencies:
      - target: Companion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Companion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Companion:
    build:
      targets:
        Companion: all
    test:
      targets: [CompanionTests, CompanionUITests]
