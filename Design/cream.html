<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мира · кремовый дизайн</title>
<style>
:root{color-scheme:light;--paper:#f3f0e6;--ink:#32372f;--muted:#62675b;--accent:#776536;--honey:#e7dcb6}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e5e1d6}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.review{min-height:52px;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px;font-size:12px;background:#fffaf0;border-bottom:1px solid #d7d1bf;flex-wrap:wrap}.review span{color:#666a5e}.review select{border:1px solid #d7d1bf;border-radius:9px;padding:6px;background:white}
.screen{height:100vh;min-height:320px;position:relative;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 0 0,#e7dcb688,transparent 70%),radial-gradient(ellipse at 100% 50%,#ffffffcc,transparent 70%),var(--paper)}
.doodle{position:absolute;z-index:-1;pointer-events:none;color:#77653633;stroke-width:1;transform:translate(-50%,-50%)}.d1{left:84%;top:21%;width:34px;height:34px}.d2{left:13%;top:49%;width:20px;height:20px}.d3{left:89%;top:63%;width:16px;height:16px}
.topbar{display:flex;align-items:center;gap:8px;padding:16px 24px 4px;flex:none}.wordmark{font-size:28px;font-weight:800;letter-spacing:-1px}.brand-star{color:var(--accent);width:23px;height:23px}.tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}.settings{margin-left:4px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fffaf099;border:1px solid #ffffffd9;box-shadow:0 3px 8px #66563208}
main{display:flex;flex-direction:column;flex:1;min-height:0}.stage{position:relative;flex:1;min-height:80px;overflow:hidden}.stage iframe{border:0;position:absolute;inset:0;width:100%;height:100%;background:transparent}.ground{position:absolute;width:160px;height:16px;bottom:12px;left:calc(50% - 80px);border-radius:50%;background:#7765361f;filter:blur(12px)}
.controls{padding:0 24px 24px;flex:none;text-align:center}.copy{margin-bottom:18px}h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.6px;line-height:1.2}.detail{font-size:15px;line-height:1.45;color:var(--muted);margin:8px auto 0;max-width:360px}.dock{display:flex;gap:12px;align-items:center;padding:10px;border-radius:30px;background:linear-gradient(130deg,#fffef9cc,#fffef978);border:1px solid #ffffffd9;box-shadow:0 8px 20px #77653617,inset 0 -1px 1px #7765360a;backdrop-filter:blur(20px)}.side{width:48px;height:56px;flex-shrink:0;display:grid;place-items:center;border-radius:24px}.side:hover{background:#ffffff99}.primary{min-height:56px;flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 12px;border-radius:100px;background:linear-gradient(#eee4c9,#e5d8ae);box-shadow:inset 0 1px 1px #fff9,0 2px 5px #7765360c;font-size:17px;font-weight:600;white-space:nowrap}.primary svg{width:20px;height:20px}.side:disabled{opacity:.3;cursor:default}
.sheet{position:absolute;inset:12% 0 0;background:#f8f5ecf5;backdrop-filter:blur(22px);border-radius:30px 30px 0 0;padding:26px 24px;box-shadow:0 -10px 60px #32372f17;display:none;z-index:5}.sheet.open{display:block}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.sheet h2{font-size:23px;margin:0}.sheet p{line-height:1.6;color:var(--muted)}.sheet button{min-height:44px}.sheet .row{background:#fff9;border-radius:18px;padding:18px;margin:12px 0;font-size:15px}.sheet .note{font-size:12px}
@media(min-width:600px) and (min-aspect-ratio:1/1){main{flex-direction:row;align-items:center;gap:20px}.stage{align-self:stretch}.controls{width:calc(min(360px,40vw) + 48px);padding:0 24px 16px}.topbar{padding-top:8px}}
@media(max-width:350px){.topbar{padding-left:20px;padding-right:20px}.controls{padding-left:20px;padding-right:20px}.tag{font-size:10px}.dock{gap:8px;padding:8px}.side{width:44px}.primary{font-size:15px;padding:8px}.detail{font-size:14px}}
/* Reference refinement: compact navigation, paper reply card and status strip. */
.topbar{gap:4px;padding-top:12px}.wordmark{font-size:22px;letter-spacing:-.8px}.brand-star{width:14px;height:14px}.navigation{margin-left:auto;display:flex;gap:2px;align-items:center;padding:0 4px;border-radius:14px;background:#fffaf099;border:1px solid #ffffffcc;box-shadow:0 3px 10px #77653609}.navigation .selected{display:flex;gap:5px;align-items:center;padding:0 10px;height:36px;font-size:12px;font-weight:500;background:#ffffffa6;border-radius:10px}.selected svg{width:13px;height:13px}.navigation button{width:44px;height:44px;display:grid;place-items:center;margin:0;border:0;background:none;box-shadow:none;border-radius:10px}.navigation button:hover{background:#fff9}.navigation button svg{width:18px;height:18px}
.copy{text-align:left;background:#ffffff7a;border:1px solid #ffffffcc;border-radius:16px;padding:14px;margin-bottom:8px}h1{font-size:16px;font-weight:600;letter-spacing:0}.detail{font-size:13px;line-height:1.4;margin:5px 0 0;max-width:none}.dock{border-radius:18px;gap:8px;padding:8px;box-shadow:0 4px 12px #7765360f}.side{width:44px;height:48px;border-radius:10px}.side svg{width:18px;height:18px}.primary{min-height:48px;border-radius:12px;font-size:14px;gap:7px}.primary svg{width:18px;height:18px}.status-strip{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;color:var(--muted);font-size:9px;font-weight:500}.status-strip span{background:#ffffff66;border-radius:30px;padding:4px 6px;white-space:nowrap}
@media(max-width:350px){.topbar{gap:4px}.navigation .selected{padding:0 8px}.detail{font-size:13px}.primary{font-size:14px}}

</style><link rel="stylesheet" href="screens.css"></head>
<body>
<div class="review"><strong>Визуальный макет · не снимок iOS</strong><span>Настоящая 3D-сцена; кнопки показывают примеры состояний.</span><select aria-label="Состояние макета" id="states"><option value="setup">Первый запуск</option><option value="idle">Готова к разговору</option><option value="listening">Слушает</option><option value="thinking">Думает</option><option value="speaking">Отвечает</option></select></div>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7M5 9v11h5v-6h4v6h5V9"/></symbol>
<symbol id="commands" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4ZM3 12l9 4 9-4M3 17l9 4 9-4"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="M12 2Q12 12 22 12Q12 12 12 22Q12 12 2 12Q12 12 12 2Z"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M3 6h7m4 0h7M3 12h12m4 0h2M3 18h2m4 0h12"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M6 4h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 3v-3a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M8 9h8M8 13h5"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol>
<symbol id="voice" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4ZM17 8q4 4 0 8m3-11q6 7 0 14"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
</defs></svg>
<div class="screen" id="screen">
<svg class="doodle d1" aria-hidden="true"><use href="#spark"/></svg><svg class="doodle d2" aria-hidden="true"><use href="#spark"/></svg><svg class="doodle d3" aria-hidden="true"><use href="#spark"/></svg>
<header class="topbar"><span class="wordmark">мира</span><svg class="brand-star" aria-hidden="true"><use href="#spark"/></svg><nav class="navigation" aria-label="Главная навигация"><span class="selected"><svg><use href="#home"/></svg>Главная</span><button class="commands" aria-label="Команды"><svg><use href="#commands"/></svg></button><button class="settings" aria-label="Настройки"><svg><use href="#sliders"/></svg></button></nav></header>
<main><section class="stage" aria-label="Мира — 3D-персонаж"><div class="ground"></div><iframe title="Персонаж Мира" src="../Resources/Web/index.html"></iframe></section>
<section class="controls"><div class="copy"><h1>Привет, я Мира</h1><p class="detail">Выбери модель — и давай знакомиться.</p></div><div class="dock"><button class="side chat" aria-label="Открыть чат"><svg><use href="#chat"/></svg></button><button class="primary" aria-label="Подготовить Миру"><svg><use href="#mic"/></svg><span>Начнём?</span></button><button class="side voice" aria-label="Послушать Миру"><svg><use href="#voice"/></svg></button></div><div class="status-strip"><span class="ai-status">✧ ИИ не выбран</span><span class="mic-status">Микрофон выкл.</span><span>Голос iOS</span></div></section></main>
<section class="sheet" aria-label="Пример дополнительного экрана"><div class="sheet-head"><h2>Настройки</h2><button class="close">Готово</button></div><div class="sheet-content"></div></section>
</div>
<script>
const frame=document.querySelector('iframe');const select=document.querySelector('#states');
const captions={setup:['Привет, я Мира','Выбери модель — и давай знакомиться.','Начнём?'],idle:['Давай поговорим','Обо всём на свете. Или просто о твоём дне.','Поговорим'],listening:['Я слушаю тебя','Разговор продолжается, пока ты его не завершишь.','Закончить'],thinking:['Дай подумать…','Разговор продолжается, пока ты его не завершишь.','Закончить'],speaking:['Вот что я думаю…','Разговор продолжается, пока ты его не завершишь.','Закончить']};
window.setPreviewState=(state)=>{if(!captions[state])return;select.value=state;document.querySelector('.ai-status').textContent=state==='setup'?'✧ ИИ не выбран':'✧ ИИ выбран';document.querySelector('.mic-status').textContent=state==='listening'?'Микрофон вкл.':'Микрофон выкл.';document.querySelector('h1').textContent=captions[state][0];document.querySelector('.detail').textContent=captions[state][1];document.querySelector('.primary span').textContent=captions[state][2];document.querySelector('.primary use').setAttribute('href',['setup','idle'].includes(state)?'#mic':'#stop');frame.contentWindow.companion?.setState(['setup','idle'].includes(state)?'idle':state,false);};
frame.addEventListener('load',()=>window.setPreviewState(select.value));select.onchange=()=>window.setPreviewState(select.value);
function showSheet(title,body){document.querySelector('.sheet h2').textContent=title;document.querySelector('.sheet-content').innerHTML=body;document.querySelector('.sheet').classList.add('open');frame.contentWindow.companion?.setActive(false);}
document.querySelector('.close').onclick=()=>{document.querySelector('.sheet').classList.remove('open');frame.contentWindow.companion?.setActive(true);};
document.querySelector('.settings').onclick=()=>showSheet('Настройки','<div class="row">На iPhone · локальные модели</div><div class="row">Голос и распознавание речи</div><div class="row">Поиск в интернете</div><p class="note">Это пример оформления. Подключения настраиваются в iOS-приложении.</p>');
document.querySelector('.commands').onclick=()=>showSheet('Команды','<div class="row">Заметки</div><div class="row">Напоминания</div><div class="row">Поиск в интернете</div><p class="note">Пример оформления. Команды выполняются в iOS-приложении.</p>');
document.querySelector('.chat').onclick=()=>showSheet('Разговор','<h2>О чём поговорим?</h2><p>Расскажи, как прошёл день.</p><p class="note">Макет дополнительного экрана. Здесь не отправляются сообщения.</p>');
document.querySelector('.primary').onclick=()=>{if(select.value==='setup')document.querySelector('.settings').click();else window.setPreviewState(select.value==='idle'?'listening':'idle');};
document.querySelector('.voice').onclick=()=>showSheet('Голос Миры','<p>В приложении эта кнопка проигрывает настоящий голос без модели ИИ.</p><p class="note">Этот браузерный макет проверяет внешний вид и не имитирует готовую озвучку.</p>');
</script><script src="screens.js"></script></body></html>
