name: iOS compile and test (internal)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS build host (use macos-15 variants for the iOS 18.5 simulator)'
        type: choice
        options: [macos-26, macos-15, macos-15-intel]
        default: macos-26
      verify_local_inference:
        description: 'Run real Qwen/Gemma inference (keep enabled for model/runtime changes)'
        type: boolean
        default: true
      test_ios_version:
        description: 'Simulator OS: native glass or material fallback'
        type: choice
        options: ['26.2', '18.5']
        default: '26.2'
permissions:
  contents: read
jobs:
  ios:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MIRA_TEST_IOS_VERSION: ${{ inputs.test_ios_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Liquid Glass toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project generator
        run: brew install xcodegen
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: Packages/LocalLLM/Artifacts
          key: llama-b12430-v2-${{ inputs.runner }}-xcode26.2-${{ runner.arch }}
      - name: Prepare local runtime
        run: bash Scripts/prepare-local-runtime.sh
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: Packages/LocalLLM/Artifacts
          key: llama-b12430-v2-${{ inputs.runner }}-xcode26.2-${{ runner.arch }}
      - name: Compile unsigned device archive
        run: bash Scripts/build-ios.sh
      - name: Verify actual local model inference
        if: inputs.verify_local_inference
        run: bash Scripts/test-local-model.sh
      - name: Run native tests
        run: bash Scripts/test-ios.sh
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-evidence
          path: |
            build/Tests.xcresult
            build/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mira-internal-unsigned
          path: |
            build/Mira-unsigned.ipa
          retention-days: 7
      - name: Quality status
        run: echo 'Internal build only. Visual parity, voice quality and physical-device checks are still required.'
