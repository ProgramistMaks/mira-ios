<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Мира</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="cream">
    <div class="shell">
      <header class="titlebar">
        <div class="brand"><img src="icon.png" alt="" /><b>Мира</b><span>для ПК</span></div>
        <div class="window">
          <button data-win="min" aria-label="Свернуть" data-i="minus"></button
          ><button data-win="max" aria-label="Развернуть" data-i="square"></button
          ><button data-win="close" aria-label="Свернуть в трей" data-i="x"></button>
        </div>
      </header>
      <div class="toolbar">
        <nav id="tabs" aria-label="Разделы"></nav>
        <div class="surfaceTools">
          <button
            id="panelWidgets"
            title="Панель виджетов"
            aria-label="Панель виджетов"
            aria-expanded="false"
            data-i="layout-dashboard"
          ></button
          ><button
            data-act="showAvatar"
            id="homeCharacter"
            title="Вита на главной"
            aria-label="Вита на главной"
            data-i="user-round"
          ></button>
          <button
            id="topOverlay"
            class="plain"
            title="Персонаж поверх окон"
            aria-label="Персонаж поверх окон"
            data-i="pin"
          ></button>
        </div>
      </div>
      <div class="rail">
        <button data-go="home" title="Разговор" aria-label="Разговор" data-i="message-circle"></button
        ><button
          data-go="desk"
          title="Рабочий стол"
          aria-label="Рабочий стол"
          data-i="layout-dashboard"
        ></button
        ><span></span
        ><button id="historyBtn" title="История чатов" aria-label="История чатов" data-i="history"></button
        ><button id="newChat" title="Новый чат" aria-label="Новый чат" data-i="square-pen"></button><i></i
        ><button
          data-go="settings"
          title="Настройки"
          aria-label="Настройки"
          data-i="sliders-horizontal"
        ></button>
      </div>
      <main id="area" data-page="home">
        <section id="home">
          <div id="hero">
            <div id="welcome">
              <h1>
                <span class="possessive">твоя </span><em id="heroName">Мира</em><span class="shine">✦</span>
              </h1>
              <p id="hello"></p>
            </div>
            <div id="chatBox" hidden>
              <div class="chatTitle">
                <span class="tiny">Разговор</span>
                <h2 id="chatTitle"></h2>
              </div>
              <div id="messages" aria-live="polite"></div>
            </div>
            <div id="compose">
              <div id="attachment" hidden></div>
              <form id="messageForm">
                <button
                  type="button"
                  data-act="context"
                  aria-label="Добавить контекст"
                  title="Добавить контекст"
                  data-i="plus"
                ></button>
                <textarea
                  id="prompt"
                  rows="1"
                  placeholder="Спроси о чём угодно…"
                  aria-label="Сообщение"
                ></textarea
                ><button
                  type="button"
                  data-act="abilities"
                  id="slash"
                  aria-label="Слэш-команды"
                  title="Слэш-команды"
                >
                  /</button
                ><button
                  type="button"
                  id="attach"
                  title="Добавить текстовый файл"
                  aria-label="Добавить файл"
                  data-i="paperclip"
                ></button
                ><button
                  type="button"
                  id="composeOptions"
                  aria-label="Параметры чата"
                  aria-expanded="true"
                  title="Параметры чата"
                  data-i="chevron-down"
                ></button
                ><button
                  type="button"
                  id="mic"
                  aria-label="Голосовой разговор"
                  title="Голосовой разговор"
                  data-i="mic"
                ></button
                ><button id="send" title="Отправить" aria-label="Отправить" data-i="arrow-up"></button>
              </form>
              <div id="chatOptions">
                <button data-act="chatModel" aria-label="Выбрать модель">
                  <i data-i="brain-circuit"></i><span id="chatModelName">Модель</span></button
                ><button data-act="commandPicker">Запустить <i data-i="play"></i></button>
              </div>
              <div class="quick">
                <button id="recentChat" data-icon="history">Последний чат</button>
                <button id="voiceStart" data-icon="mic">Включить микрофон</button>
                <button data-act="abilities" data-icon="sparkles">Что ты умеешь?</button>
              </div>
              <div id="voiceBar" hidden>
                <b class="pulse"></b><span id="voiceStatus"></span
                ><button id="voiceEnd" aria-label="Завершить разговор" data-i="circle-stop"></button>
              </div>
            </div>
          </div>
          <div class="homeFoot">
            <div class="subhead">
              <h2>Панель виджетов</h2>
              <button
                class="text"
                data-act="widgets"
                data-i="sliders-horizontal"
                aria-label="Расставить виджеты"
              ></button>
              <button class="text" data-go="desk">Рабочий стол <i data-i="arrow-up-right"></i></button>
            </div>
            <div id="todayCards" class="todayCards"></div>
          </div>
        </section>
        <div id="scene" aria-label="Трёхмерный персонаж">
          <div class="orbit"></div>
          <span class="sceneSpark" aria-hidden="true">✧</span
          ><iframe title="Вита" id="avatar" src="/renderer/index.html"></iframe>
          <div class="sceneNav">
            <button id="nameplate" data-go="model">
              <b></b><span>Вита</span><i data-i="chevron-right"></i></button
            ><button id="dance" title="Потанцевать" aria-label="Потанцевать" data-i="music-2"></button>
          </div>
        </div>
        <nav id="sectionNav" aria-label="Разделы страницы" hidden></nav>
        <section id="content" hidden></section>
      </main>
      <footer>
        <span class="profile"><b id="initial">М</b><span id="profile">Мой компьютер</span></span>
        <div class="service" id="services"></div>
        <span id="time"></span>
      </footer>
    </div>
    <aside id="drawer" hidden>
      <div class="subhead">
        <h3>История чатов</h3>
        <button data-dismiss="drawer" class="plain" aria-label="Закрыть" data-i="x"></button>
      </div>
      <div id="historyTools"></div>
      <input
        id="historyQuery"
        class="control"
        placeholder="Поиск по разговорам"
        aria-label="Поиск по разговорам"
      />
      <div id="history"></div>
    </aside>
    <aside id="widgetDrawer" hidden>
      <div class="subhead">
        <b>Рабочий стол</b><button data-act="dismissWidget" aria-label="Закрыть" data-i="x"></button>
      </div>
      <div id="widgetBody"></div>
    </aside>
    <dialog id="mailDialog" aria-labelledby="mailHeading">
      <header class="orgHeader">
        <h2 id="mailHeading"></h2>
        <small id="mailCount"></small>
        <div id="mailActions"></div>
        <button id="mailClose" aria-label="Закрыть" data-i="x"></button>
      </header>
      <div id="mailBody"></div>
      <p id="mailStatus" role="status" hidden></p>
    </dialog>
    <dialog id="agenda" aria-labelledby="agendaHeading">
      <header class="orgHeader">
        <h2 id="agendaHeading"></h2>
        <small id="agendaCount"></small>
        <button data-ag="add" aria-label="Добавить напоминание" data-i="plus"></button>
        <button data-ag="options" aria-label="Параметры календаря" data-i="sliders-horizontal"></button>
        <button data-ag="close" aria-label="Закрыть" data-i="x"></button>
      </header>
      <label id="agendaOptions" hidden
        >На экране ПК
        <select id="calendarPlace">
          <option value="off">В приложении</option>
          <option value="window">В отдельном окне</option>
          <option value="pin">Поверх окон</option>
        </select></label
      >
      <div id="agendaBody"></div>
    </dialog>
    <dialog id="organizer" aria-labelledby="orgHeading">
      <header class="orgHeader">
        <h2 id="orgHeading"></h2>
        <small id="orgCount"></small>
        <button data-org="add" id="orgAdd" aria-label="Добавить" data-i="plus"></button>
        <button data-org="options" aria-label="Параметры виджета" data-i="sliders-horizontal"></button>
        <button data-org="close" aria-label="Закрыть" data-i="x"></button>
      </header>
      <div id="orgOptions" hidden>
        <label
          >На экране ПК
          <select id="orgPlace">
            <option value="off">В приложении</option>
            <option value="window">В отдельном окне</option>
            <option value="pin">Поверх окон</option>
          </select></label
        >
        <button data-org="renameList">Переименовать список</button>
        <button data-org="removeList">Перенести задачи в основной список и удалить список</button>
      </div>
      <div class="orgLayout">
        <nav id="orgList" aria-label="Список записей"></nav>
        <section id="orgPane"></section>
      </div>
    </dialog>
    <dialog id="intro" aria-labelledby="introTitle">
      <button id="introSkip" type="button">Пропустить</button>
      <div class="introPage">
        <div id="introMark"></div>
        <h2 id="introTitle"></h2>
        <p id="introInfo"></p>
        <div id="introFields"></div>
        <p id="introError" role="alert"></p>
      </div>
      <div class="introFoot">
        <button id="introBack">Назад</button><span id="introProgress"></span
        ><button id="introNext">Далее</button>
      </div>
    </dialog>
    <dialog id="modal">
      <div class="subhead">
        <h2 id="modalTitle"></h2>
        <button class="plain" data-dismiss="modal" aria-label="Закрыть" data-i="x"></button>
      </div>
      <div id="modalBody"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
