<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'"
    />
    <title>Вита на рабочем столе</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font: 12px system-ui;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      nav {
        position: absolute;
        inset: auto 12% 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        opacity: 0;
      }
      body:hover nav,
      nav:focus-within {
        opacity: 1;
      }
      button {
        background: #fff8eaeb;
        border: 1px solid #d8caba;
        color: #523e49;
        border-radius: 20px;
        padding: 5px 9px;
      }
      button {
        cursor: pointer;
      }
      #dragHandle {
        cursor: grab;
        touch-action: none;
      }
      #dragHandle:active { cursor: grabbing; }
      body[data-departing] nav { visibility: hidden; }
    </style>
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <iframe id="avatar" src="/renderer/index.html" title="Персонаж"></iframe>
    <nav class="overlayActions">
      <button id="dragHandle" title="Перетащи, чтобы переместить" aria-label="Переместить персонажа">⠿</button><button id="open">Мира</button
      ><button id="more" title="Настройки персонажа">•••</button>
      <button id="hide" title="Скрыть персонажа" aria-label="Скрыть персонажа">×</button>
    </nav>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
